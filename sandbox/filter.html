<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="filter.css" />
    <title>Filter</title>
  </head>
  <body>
    <div><img src="images/koala.image.jpg" alt="koala" /></div>
    <div>
      <img class="grayscale" src="images/koala.image.jpg" alt="koala" />
    </div>
    <div><img class="blur" src="images/koala.image.jpg" alt="koala" /></div>
    <div><img class="invert" src="images/koala.image.jpg" alt="koala" /></div>
    <div><img class="hue" src="images/koala.image.jpg" alt="koala" /></div>
    <div>
      <img class="brightness" src="images/koala.image.jpg" alt="koala" />
    </div>
    <div><img class="contrast" src="images/koala.image.jpg" alt="koala" /></div>
    <div><img class="sepia" src="images/koala.image.jpg" alt="koala" /></div>
    <div><img class="shadow" src="images/koala.image.jpg" alt="koala" /></div>
    <div><img class="saturate" src="images/koala.image.jpg" alt="koala" /></div>
    <div><img class="opacity" src="images/koala.image.jpg" alt="koala" /></div>
  </body>
</html>
